name: Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Skip tests (emergency deploys only)
        type: boolean
        default: false

concurrency:
  group: production
  cancel-in-progress: false # never cancel an in-flight production deploy

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '8'

# JOBS
jobs:
  # === step 1: Install ===
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get PNPM store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache PNPM store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  # === step 2: Lint ===
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Restore PNPM cache
        uses: actions/cache@v4
        with:
          path: $(pnpm store path)
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint

  # === step 3: Type Check ===
  type-check:
    name: Type check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile

      - name: API — type check
        run: pnpm --filter @digifactory_idearium/api type-check

      - name: Web — type check (tsc -b)
        run: pnpm --filter @digifactory_idearium/web exec tsc -b --noEmit

  # === step 4: Test ===
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: install
    if: ${{ !inputs.skip_tests }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: idearium_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/idearium_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @digifactory_idearium/api db:generate

      - name: Run API migrations on test DB
        run: pnpm --filter @digifactory_idearium/api exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: API — Jest
        run: pnpm --filter @digifactory_idearium/api test:ci
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Web — Vitest
        run: pnpm --filter @digifactory_idearium/web test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            apps/api/coverage/
            apps/web/coverage/
          retention-days: 7

  # === step 5: Build ===
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    # run build if lint ok, type check ok, (test or skip test) ok
    if: |
      always() &&
      needs.lint.result == 'success' &&
      needs.type-check.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Build all packages
        run: pnpm turbo build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Upload API build artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: |
            apps/api/dist/
            apps/api/package.json
            apps/api/prisma/
            apps/api/ecosystem.config.js
          retention-days: 1

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 1

  # === step 6: Deploy ===
  deploy:
    name: Deploy to unamur server
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-dist
          path: artifacts/api

      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: artifacts/web

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Sync API to server
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            artifacts/api/dist/         ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.REMOTE_DIR }}/api/dist/
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key" \
            artifacts/api/package.json  ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.REMOTE_DIR }}/api/
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key" \
            artifacts/api/prisma/       ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.REMOTE_DIR }}/api/prisma/
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key" \
            artifacts/api/ecosystem.config.js ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.REMOTE_DIR }}/api/

      - name: Sync Web to server
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            artifacts/web/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.REMOTE_DIR }}/web/

      - name: Install production dependencies
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd ${{ secrets.REMOTE_DIR }}/api && pnpm install --prod --frozen-lockfile"

      - name: Run database migrations
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd ${{ secrets.REMOTE_DIR }}/api && pnpm exec prisma migrate deploy"

      - name: Restart API via PM2
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd ${{ secrets.REMOTE_DIR }}/api && pm2 restart idearium-api || pm2 start ecosystem.config.js --env production && pm2 save"

      - name: Health check
        run: |
          echo "Waiting 10s for the process to stabilise..."
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://${{ secrets.SERVER_HOST }}/api/health)
          if [ "$STATUS" != "200" ]; then
            echo "Χ Health check failed — HTTP $STATUS"
            exit 1
          fi
          echo "✓ Health check passed — HTTP $STATUS"

  # === Step 7: Notify ===
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Deployment succeeded
        if: needs.deploy.result == 'success'
        run: |
          echo "✓ Production deploy succeeded"
          echo "Commit : ${{ github.sha }}"
          echo "Author : ${{ github.actor }}"
          echo "Branch : ${{ github.ref_name }}"
          # Swap the echo for a curl to a Slack/Discord webhook if you have one  (uncomment the next commented lines):
          # curl -X POST ${{ secrets.DISCORD_WEBHOOK }} \
          #   -H "Content-Type: application/json" \
          #   -d '{"content":"✓ **Idearium** deployed to production by ${{ github.actor }}"}'

      - name: Deployment failed
        if: needs.deploy.result == 'failure'
        run: |
          echo "Χ Production deploy FAILED"
          echo "Commit : ${{ github.sha }}"
          echo "Author : ${{ github.actor }}"
          # Swap the echo for a curl to a Slack/Discord webhook if you have one (uncomment the next commented lines):
          # curl -X POST ${{ secrets.DISCORD_WEBHOOK }} \
          #   -H "Content-Type: application/json" \
          #   -d '{"content":"Χ **Idearium** production deploy FAILED — check the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
          exit 1
